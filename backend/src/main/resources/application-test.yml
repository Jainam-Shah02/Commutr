server:
  port: 0

spring:
  application:
    name: commutr-backend-test
  datasource:
    url: jdbc:h2:mem:commutr_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

commutr:
  cors:
    allowed-origins: "*"
