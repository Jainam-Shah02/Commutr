server:
  port: 8080

spring:
  application:
    name: commutr-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/commutr_db}
    username: ${SPRING_DATASOURCE_USERNAME:commutr}
    password: ${SPRING_DATASOURCE_PASSWORD:commutr_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      continue-on-error: true

commutr:
  cors:
    allowed-origins: "*"
